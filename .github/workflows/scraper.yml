name: Rydeu Order Scraper

on:
  # GitHub's own `schedule:` trigger used to be here (*/5 * * * *) but is
  # documented as best-effort and was observed in practice skipping runs for
  # 1.7-5 hours at a stretch under load - useless for a competitive order
  # scraper. workflow_dispatch (the manual "Run workflow" button) is now
  # driven by an external, actually reliable timer instead - see README.md's
  # deployment section for the cron-job.org setup (same fix fleet-scraper uses).
  workflow_dispatch:

# A run typically takes 1-2 minutes, but the cron-job.org timer above can
# fire as often as every 1 minute - without this, overlapping runs would
# execute in parallel: both read the same "already notified" cache before
# either saves its update, risking a duplicate Discord ping for the same
# order, plus wasted double-scraping. cancel-in-progress: false queues the
# newer trigger instead of running alongside (or killing) the one in flight.
concurrency:
  group: rydeu-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest preinstalls Google Chrome and various Microsoft
      # packages, which register dl.google.com/linux/chrome-stable and
      # packages.microsoft.com as apt sources. We need neither - Chromium
      # comes from Playwright itself - and both have independently been seen
      # breaking apt-get update for everything (a stale "Hash Sum mismatch"
      # from Google's mirror, a "403 Forbidden / no longer signed" from
      # Microsoft's), so drop them before installing.
      - name: Remove unused apt sources (Chrome, Microsoft)
        run: |
          sudo grep -rl "dl.google.com/linux/chrome\|packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          echo "Remaining sources (should be empty):"
          sudo grep -rl "dl.google.com/linux/chrome\|packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || echo "(none)"

      # Retry too, as a safety net against other transient mirror issues.
      - name: Install Playwright browsers
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Restore cookies
        id: restore-cookies
        uses: actions/cache@v4
        with:
          path: cookies.json
          key: rydeu-cookies-${{ github.run_id }}
          restore-keys: |
            rydeu-cookies-

      - name: Restore storage
        id: restore-storage
        uses: actions/cache@v4
        with:
          path: storage.json
          key: rydeu-storage-${{ github.run_id }}
          restore-keys: |
            rydeu-storage-

      - name: Restore state
        id: restore-state
        uses: actions/cache@v4
        with:
          path: state.json
          key: rydeu-state-${{ github.run_id }}
          restore-keys: |
            rydeu-state-

      - name: Restore auction state
        id: restore-auction-state
        uses: actions/cache@v4
        with:
          path: auction-state.json
          key: rydeu-auction-state-${{ github.run_id }}
          restore-keys: |
            rydeu-auction-state-

      # The cache is only ever populated by a previous successful run. The
      # first run (or any run after the cache is evicted) falls back to a
      # one-time snapshot taken from a real `npm run login` and stored as
      # secrets, since CI has no display to log in interactively itself.
      - name: Seed session from secrets if cache missed
        if: steps.restore-cookies.outputs.cache-hit != 'true'
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          STORAGE_JSON: ${{ secrets.STORAGE_JSON }}
        run: |
          echo "$COOKIES_JSON" | base64 -d > cookies.json
          echo "$STORAGE_JSON" | base64 -d > storage.json

      - name: Run scraper + auction check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEADLESS: 'true'
          DEBUG: ${{ secrets.DEBUG || 'false' }}
        run: npm run poll

      - name: Save cookies
        uses: actions/cache@v4
        with:
          path: cookies.json
          key: rydeu-cookies-${{ github.run_id }}

      - name: Save storage
        uses: actions/cache@v4
        with:
          path: storage.json
          key: rydeu-storage-${{ github.run_id }}

      - name: Save state
        uses: actions/cache@v4
        with:
          path: state.json
          key: rydeu-state-${{ github.run_id }}

      - name: Save auction state
        uses: actions/cache@v4
        with:
          path: auction-state.json
          key: rydeu-auction-state-${{ github.run_id }}

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: |
            *.log
            cookies.json
          retention-days: 1

  notify-on-failure:
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping"
            exit 0
          fi
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Rydeu Scraper Failed",
                "description": "The scheduled scraper failed. Check GitHub Actions for details.",
                "color": 16711680,
                "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }'
