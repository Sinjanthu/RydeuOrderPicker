name: Rydeu Order Scraper

on:
  # GitHub's own `schedule:` trigger used to be here (*/5 * * * *) but is
  # documented as best-effort and was observed in practice skipping runs for
  # 1.7-5 hours at a stretch under load - useless for a competitive order
  # scraper. workflow_dispatch (the manual "Run workflow" button) is now
  # driven by an external, actually reliable timer instead - see README.md's
  # deployment section for the cron-job.org setup (same fix fleet-scraper uses).
  workflow_dispatch:

# The cron-job.org timer above can fire as often as every 1 minute - without
# this, overlapping runs would execute in parallel: both read the same
# "already notified" cache before either saves its update, risking a
# duplicate Discord ping for the same auction. cancel-in-progress: false
# queues the newer trigger instead of running alongside (or killing) the one
# in flight.
concurrency:
  group: rydeu-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # This hits the Rydeu API directly (see src/apiAuth.js, src/auction.js) -
    # no browser involved - so a run is a couple of HTTP calls and normally
    # finishes in seconds. Was 10 when this launched a Playwright browser.
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore auction state
        uses: actions/cache@v4
        with:
          path: auction-state.json
          key: rydeu-auction-state-${{ github.run_id }}
          restore-keys: |
            rydeu-auction-state-

      # Login is one cheap POST (see src/apiAuth.js) and the resulting JWT
      # only lasts 30 days with no refresh token, so there's no session to
      # cache/seed here the way the old Playwright cookies were - just log
      # in fresh with the account credentials every run.
      - name: Check auction board
        env:
          RYDEU_EMAIL: ${{ secrets.RYDEU_EMAIL }}
          RYDEU_PASSWORD: ${{ secrets.RYDEU_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run poll

      - name: Save auction state
        uses: actions/cache@v4
        with:
          path: auction-state.json
          key: rydeu-auction-state-${{ github.run_id }}

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: |
            *.log
          retention-days: 1
          if-no-files-found: ignore

  notify-on-failure:
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping"
            exit 0
          fi
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Rydeu Scraper Failed",
                "description": "The scheduled scraper failed. Check GitHub Actions for details.",
                "color": 16711680,
                "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }'
